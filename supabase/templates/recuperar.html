<!doctype html>
<html lang="es">
<body style="margin:0;padding:0;background:#f3f8fc;font-family:Roboto,Arial,sans-serif;color:#16202a">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f8fc;padding:32px 12px">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #dce5ee;border-radius:16px">
        <tr><td style="padding:28px 32px 8px;font-size:20px;font-weight:600;color:#1479c4">StudyVerse</td></tr>
        <tr><td style="padding:8px 32px 28px;font-size:15px;line-height:1.55">
          <p style="margin:0">Pediste cambiar tu contraseña. Ingresá este código en StudyVerse y elegí una nueva:</p>
          <div style="margin:20px 0;padding:16px;background:#e8f4fd;border-radius:12px;text-align:center;font-size:32px;letter-spacing:8px;font-weight:600;color:#0b3a5b">{{ .Token }}</div>
        </td></tr>
      </table>
      <p style="max-width:480px;font-size:12px;line-height:1.5;color:#6b7a88;margin:16px auto 0">El código vence en 15 minutos. Si no lo pediste, ignorá este correo: tu contraseña no cambia.</p>
    </td></tr>
  </table>
</body>
</html>
